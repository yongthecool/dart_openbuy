name: DART 공개매수 20분 주기 자동 알리미

on:
  schedule:
    # 매 20분마다 실행 (UTC 기준)
    - cron: '*/20 * * * *'
  # GitHub 웹사이트에서 [Run workflow] 버튼으로 수동 즉시 실행 가능
  workflow_dispatch:

# 중복 발송 방지 이력(data/sent_reports.json)을 저장하기 위한 Git Push 권한
permissions:
  contents: write

jobs:
  check-dart:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DART 공개매수 공시 점검 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_KEYWORDS: '공개매수'
          SEND_STARTUP_MESSAGE: 'False'
        run: |
          python main.py --once

      - name: 발송 이력(중복 방지 캐시) 자동 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/sent_reports.json ]; then
            git add data/sent_reports.json
            git diff --staged --quiet || (git commit -m "chore: update sent reports cache [skip ci]" && git push)
          fi
